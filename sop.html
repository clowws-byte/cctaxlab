<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Hub · CCT Protocol · CCTaxLab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230b1430' stroke='%2300aeef' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%2300aeef'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#e7ecf3; --bg-b:#dbe2ec; --ink:#0b1626; --muted:#475569; --dim:#7b8799;
  --panel:rgba(255,255,255,.82); --panel2:rgba(255,255,255,.9); --line:#d3dce8; --line2:#c2cfdf;
  --field:#ffffff; --sheet:#f6f8fb; --soft:#edf2f8; --soft2:#f1f5fa; --shadow:rgba(15,35,70,.10);
  --acc:#0284c7; --acc2:#0369a1; --acc-rgb:2,132,199; --violet:#6d28d9; --btn-ink:#ffffff; --teal:#0f766e; --red:#dc2626; --amber:#a16207;
  --neb1:transparent; --neb2:transparent; --glow:rgba(2,132,199,.22);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace; --head:"Space Grotesk","Plus Jakarta Sans",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(70vmax 50vmax at 85% -10%,var(--neb1),transparent 60%),radial-gradient(60vmax 45vmax at -10% 110%,var(--neb2),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg-b));background-attachment:fixed}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--acc2)}

.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 100px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:38px;display:block}
.divline{width:1px;height:38px;background:var(--line2)}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
.brand .sub{margin:2px 0 0;font-size:12px;color:var(--acc2);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.who{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.tag{font-size:10.5px;padding:3px 8px;border-radius:6px;background:rgba(var(--acc-rgb),.14);color:var(--acc2);font-weight:700;letter-spacing:.6px;border:1px solid rgba(var(--acc-rgb),.3)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--line2);padding:7px 12px;border-radius:8px}
.back:hover{color:var(--ink);border-color:var(--muted)}
@media(max-width:620px){.brand img{height:26px}.divline{display:none}}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:28px 0 16px}
.hero h2{margin:0;font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:-.5px}
.hero h2 span{background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;color:var(--btn-ink);background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 4px 18px rgba(var(--acc-rgb),.25)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.danger{background:rgba(240,113,120,.12);color:#c53030;border:1px solid rgba(240,113,120,.45);box-shadow:none}

.searchbar{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 16px;backdrop-filter:blur(10px)}
.searchbar svg{color:var(--muted)}
.searchbar input{flex:1;background:none;border:0;color:var(--ink);font-size:16px;padding:10px 4px;outline:none;min-width:0}
.searchbar input::placeholder{color:var(--dim)}
.hint{color:var(--dim);font-size:12px;margin:8px 2px 0}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:700;color:var(--dim);font-size:11px}
.chip.on{background:rgba(var(--acc-rgb),.16);border-color:rgba(var(--acc-rgb),.55);color:var(--acc2)}
.chip.on b{color:var(--acc2)}
select.sel,input.inp,textarea.inp{background:var(--field);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:13.5px;outline:none}
select.sel:focus,input.inp:focus,textarea.inp:focus{border-color:rgba(var(--acc-rgb),.6)}
select.sel option{background:#fff}
.spacer{flex:1}
.count{color:var(--muted);font-size:13px;margin:14px 2px 10px}

.results{display:grid;gap:10px}
.card{background:var(--panel);box-shadow:0 1px 4px var(--shadow);border:1px solid var(--line);border-radius:14px;padding:15px 18px;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;cursor:pointer;transition:border-color .15s,transform .15s;backdrop-filter:blur(8px)}
.card:hover{border-color:rgba(var(--acc-rgb),.45);transform:translateY(-1px)}
.ficon{width:44px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#fff;background:#3b4a72;position:relative}
.ficon.pdf{background:#c2410c}.ficon.doc{background:#1d4ed8}.ficon.xls{background:#15803d}.ficon.ppt{background:#b45309}.ficon.img{background:#7c3aed}.ficon.txt{background:#475569}.ficon.web{background:#0e7490}
.card h3{margin:0 0 4px;font-size:15.5px;font-weight:700;line-height:1.35}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(79,209,197,.12);color:#1d7a70;border:1px solid rgba(79,209,197,.4)}
.pill.type{background:rgba(var(--acc-rgb),.12);color:var(--acc2);border-color:rgba(var(--acc-rgb),.3)}
.pill.draft{background:rgba(245,194,107,.12);color:var(--amber);border-color:rgba(245,194,107,.35)}
.snip{margin:8px 0 0;color:#46536b;font-size:13.5px;line-height:1.55}
mark{background:rgba(255,213,79,.55);color:#14203a;border-radius:3px;padding:0 2px}
.date{color:var(--muted);font-size:12.5px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line2);border-radius:16px}
.empty h3{color:var(--ink);margin:0 0 6px}

/* drawer + modal */
.dim{position:fixed;inset:0;background:rgba(20,32,58,.35);backdrop-filter:blur(2px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--sheet);border-left:1px solid var(--line2);z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:18px;line-height:1.35;flex:1}
.x{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.x:hover{color:var(--ink)}
.dbody{padding:18px 20px 30px;overflow:auto;flex:1}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px;margin:0 0 18px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.sect{margin:18px 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--acc2);font-weight:700}
.summary{line-height:1.6;color:#2c3850;font-size:14px;white-space:pre-wrap}
.fulltext{white-space:pre-wrap;font-size:13px;line-height:1.6;color:#2c3850;background:var(--soft2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:none}
.ftbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}

/* upload */
.modal{position:fixed;inset:4vh 0 auto;margin:0 auto;width:min(980px,96vw);max-height:92vh;background:var(--sheet);border:1px solid var(--line2);border-radius:18px;z-index:22;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(20,32,58,.25);opacity:0;pointer-events:none;transform:translateY(10px);transition:all .2s}
.modal.open{opacity:1;pointer-events:auto;transform:none}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:30px 20px;text-align:center;color:var(--muted);transition:all .15s}
.drop.over{border-color:var(--acc);background:rgba(var(--acc-rgb),.07);color:var(--ink)}
.drop strong{color:var(--ink);display:block;font-size:15px;margin-bottom:4px}
.item{border:1px solid var(--line2);border-radius:14px;padding:14px 16px;margin-top:12px;background:var(--panel)}
.ihead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ihead .fn{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.state.work{color:var(--amber);background:rgba(245,194,107,.1)}
.state.ok{color:#1d7a70;background:rgba(79,209,197,.1)}
.state.warn{color:#c53030;background:rgba(240,113,120,.1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid .full{grid-column:1/-1}
@media(max-width:700px){.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.card{grid-template-columns:36px 1fr}.card .date{display:none}}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.f-in{width:100%}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:6px 8px;min-height:40px}
.tagbox input{flex:1;min-width:120px;background:none;border:0;color:var(--ink);outline:none;font-size:13px;padding:3px}
.tk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:rgba(var(--acc-rgb),.14);border:1px solid rgba(var(--acc-rgb),.35);color:var(--acc2);padding:3px 4px 3px 9px;border-radius:6px}
.tk button{background:none;border:0;color:inherit;padding:0 3px;font-size:14px;line-height:1}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick .chip{font-size:12px;padding:5px 10px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-20px);background:#14203a;color:#fff;border:1px solid #14203a;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:all .2s;z-index:40;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.gate{max-width:440px;margin:14vh auto;text-align:center;background:var(--panel2);border:1px solid var(--line2);border-radius:18px;padding:34px 28px}
.gate h3{margin:0 0 8px;font-size:20px}
.gate p{color:var(--muted);margin:0 0 20px}
.spin{width:16px;height:16px;border:2px solid #dbe3ee;border-top-color:var(--acc2);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* breadcrumb + categories */
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:22px 0 -14px;flex-wrap:wrap}
.crumbs a{color:var(--acc2);text-decoration:none;font-weight:600;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cat{position:relative;text-align:left;box-shadow:0 1px 4px var(--shadow);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;color:var(--ink);cursor:pointer;overflow:hidden;transition:border-color .15s,transform .15s;min-height:170px;display:flex;flex-direction:column;backdrop-filter:blur(8px)}
.cat:hover{border-color:rgba(var(--acc-rgb),.5);transform:translateY(-2px)}
.cat::after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(var(--acc-rgb),.35),rgba(var(--acc-rgb),.04) 70%);opacity:.6}
.cat .cicon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--acc-rgb),.12);border:1px solid rgba(var(--acc-rgb),.35);color:var(--acc2);margin-bottom:16px;position:relative;z-index:1}
.cat .cicon svg{width:22px;height:22px}
.cat h3{margin:0 0 4px;font-size:18px;position:relative;z-index:1}
.cat p{margin:0;color:var(--muted);font-size:13px;position:relative;z-index:1;flex:1}
.cat .cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted);position:relative;z-index:1}
.cat .cfoot b{color:var(--acc2)}
.cat .cadm{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:6px}
.cat .cadm button{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;width:30px;height:30px;display:grid;place-items:center}
.cat .cadm button:hover{color:var(--ink)}
.cat.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.cat.add::after{display:none}
.pill.cat-pill{background:var(--soft);color:var(--muted);border-color:var(--line2)}

/* staff cannot select / copy text on the page */
body.locked{-webkit-user-select:none;user-select:none}
body.locked input,body.locked textarea{-webkit-user-select:text;user-select:text}

/* view-only document viewer */
.viewer{position:fixed;inset:0;z-index:30;background:#ffffff;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .15s;-webkit-user-select:none;user-select:none}
.viewer.open{opacity:1;pointer-events:auto}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0c1838;border-bottom:1px solid #0c1838;color:#eef1f8}
.vbar .x{color:#c9d2e6;border-color:rgba(255,255,255,.25)}
.vbar .zoom{color:#c9d2e6!important}
.vbar .vtag{color:#f5c26b!important}
.vbar h2{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .vtag{font-size:11px;color:var(--amber);border:1px solid rgba(245,194,107,.35);background:rgba(245,194,107,.08);padding:3px 8px;border-radius:6px;font-weight:700;white-space:nowrap}
.vbar .zoom{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12.5px}
.vbody{flex:1;overflow:auto;position:relative;padding:24px 16px 60px}
.vpages{display:flex;flex-direction:column;align-items:center;gap:16px}
.vpages canvas{background:#fff;box-shadow:0 2px 14px rgba(15,30,60,.16);outline:1px solid #e3e7ef;max-width:none;display:block}
.vpage-ph{background:#fff;box-shadow:0 2px 14px rgba(15,30,60,.16);outline:1px solid #e3e7ef}
.vdoc{background:#fff;color:#111;max-width:1000px;margin:0 auto;box-shadow:0 2px 14px rgba(15,30,60,.16);outline:1px solid #e3e7ef}
.vdoc.textview{padding:40px 48px;white-space:pre-wrap;font-size:14px;line-height:1.6;font-family:Georgia,serif}
.vdocx{display:flex;justify-content:center}
.vdocx .docx-wrapper{background:transparent!important;padding:0!important}
.vdocx .docx-wrapper>section.docx{box-shadow:0 2px 14px rgba(15,30,60,.16);outline:1px solid #e3e7ef;margin-bottom:16px}
.vsheet{background:#fff;color:#111;overflow:auto;max-width:100%;width:fit-content;margin:0 auto;box-shadow:0 2px 14px rgba(15,30,60,.16);outline:1px solid #e3e7ef}
.vsheet table{border-collapse:collapse;font-size:12.5px;font-family:Calibri,Arial,sans-serif}
.vsheet td,.vsheet th{border:1px solid #d4d4d4;padding:3px 8px;white-space:nowrap}
.vtabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.vframe{width:100%;max-width:1000px;margin:0 auto;display:block;border:0;background:#fff;box-shadow:0 2px 14px rgba(15,30,60,.16);outline:1px solid #e3e7ef;min-height:70vh}
.vmsg{max-width:520px;margin:12vh auto;text-align:center;color:#5b6475;background:#f5f7fb;border:1px solid #e3e7ef;border-radius:16px;padding:30px}
.vmsg h3{color:#1a2233;margin:0 0 8px}
@media print{body *{display:none!important}body::after{content:"Printing is disabled for the SOP Hub.";display:block;padding:40px;font:16px sans-serif;color:#000}}
.wrap{position:relative}
header,.hero{background:none}

/* ---------- dark mode ---------- */
body.dark{--bg:#081631;--bg-b:#10264f;--ink:#eef1f8;--muted:#97a3bf;--dim:#6b7899;--panel:rgba(16,26,56,.72);--panel2:rgba(22,34,72,.85);--line:rgba(160,180,230,.14);--line2:rgba(160,180,230,.26);--acc2:#6fd3ff;--btn-ink:#04142b;--amber:#f5c26b;color-scheme:dark}
body.dark .card,body.dark .cat{box-shadow:none}
body.dark .cat::after{background:radial-gradient(circle at 35% 35%,rgba(var(--acc-rgb),.55),rgba(var(--acc-rgb),.08) 70%);opacity:.5}
body.dark .btn.ghost:hover{background:rgba(255,255,255,.06)}
body.dark .btn.danger{color:#ffb3b8}
body.dark .chip,body.dark .cat .cadm button,body.dark .pill.cat-pill{background:rgba(255,255,255,.04)}
body.dark select.sel,body.dark input.inp,body.dark textarea.inp,body.dark .tagbox{background:rgba(6,12,30,.55)}
body.dark select.sel option{background:#0b1430}
body.dark .pill{color:#8be9df}
body.dark .pill.type{color:var(--acc2)}
body.dark .state.ok{color:#8be9df}
body.dark .state.warn{color:#ffb3b8}
body.dark .snip{color:#c4cde2}
body.dark .summary{color:#d5dcec}
body.dark .fulltext{color:#c4cde2;background:rgba(0,0,0,.2)}
body.dark mark{background:rgba(var(--acc-rgb),.32);color:#fff}
body.dark .drawer,body.dark .modal{background:linear-gradient(180deg,#0c1838,#0a1430)}
body.dark .item{background:rgba(255,255,255,.02)}
body.dark .toast{background:#13224a;border-color:var(--line2)}
body.dark .dim{background:rgba(2,6,18,.6)}
body.dark .spin{border-color:rgba(255,255,255,.2);border-top-color:var(--acc2)}
body.dark .viewer{background:#1d2335}
body.dark .vmsg{color:var(--muted);background:var(--panel2);border-color:var(--line2)}
body.dark .vmsg h3{color:var(--ink)}
.theme{display:inline-flex;align-items:center;justify-content:center;width:36px;height:34px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--muted)}
.theme:hover{color:var(--ink)}

.idlewarn{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:14px;background:#fff;color:#1d2433;border:1px solid rgba(0,0,0,.12);box-shadow:0 14px 40px rgba(0,0,0,.25);font-size:14px}
.idlewarn .btn{width:auto;margin:0;padding:8px 14px}

/* ================= TECH LIBRARY LOOK ================= */
body{background:linear-gradient(180deg,var(--bg),var(--bg-b));background-attachment:fixed}
body.dark{--bg:#040a18;--bg-b:#081429;--ink:#e8f4ff;--muted:#8fa6c4;--dim:#5e7391;--panel:rgba(8,20,44,.74);--panel2:rgba(10,24,52,.86);--line:rgba(34,211,255,.16);--line2:rgba(34,211,255,.30);--field:rgba(4,12,28,.7);--sheet:#071430;--soft:rgba(34,211,255,.08);--soft2:rgba(34,211,255,.05);--shadow:rgba(0,0,0,.4);--acc:#00d4ff;--acc2:#5ee7ff;--acc-rgb:0,212,255;--violet:#8b6cff;--btn-ink:#021022;--glow:rgba(0,212,255,.45);color-scheme:dark}

/* typography */
.brand h1,.hero h2,.cat h3,.dhead h2,.card h3{font-family:var(--head);letter-spacing:-.2px}
.brand .sub,.crumbs,.hint,.count,.pill,.date,.kv dt,.sect,.tag,.state,.cat .cfoot,.chip b,.vbar .vtag,label.f{font-family:var(--mono)}
.brand .sub,.sect{letter-spacing:2px}
.hero h2 span{background:linear-gradient(90deg,var(--acc),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:1px;color:var(--acc2);text-transform:uppercase;border:1px solid var(--line2);background:var(--soft2);padding:4px 10px;border-radius:999px}
.status i{width:7px;height:7px;border-radius:50%;background:#18d26e;box-shadow:0 0 8px #18d26e;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* glass + HUD frames */
.searchbar,.card,.cat,.drawer,.modal{backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2)}
.searchbar{border-radius:12px;box-shadow:0 0 0 1px var(--line2),0 8px 30px var(--shadow)}
.searchbar:focus-within{box-shadow:0 0 0 1px var(--acc),0 0 24px var(--glow)}
.card,.cat{border-radius:10px;position:relative}
.card::before,.cat::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:
  linear-gradient(var(--acc),var(--acc)) top left/14px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) top left/2px 14px no-repeat,
  linear-gradient(var(--acc),var(--acc)) bottom right/14px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) bottom right/2px 14px no-repeat;opacity:.75}
.card:hover,.cat:hover{border-color:rgba(var(--acc-rgb),.6);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.25),0 0 28px var(--glow)}
.cat::after{right:-40px;top:-40px;width:140px;height:140px;border-radius:0;background:repeating-linear-gradient(0deg,rgba(var(--acc-rgb),.18) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(var(--acc-rgb),.18) 0 1px,transparent 1px 8px);-webkit-mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%);mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%);opacity:1}
.cat .cicon{border-radius:8px;box-shadow:0 0 16px var(--glow)}
.btn{border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--violet));color:#fff;box-shadow:0 0 18px var(--glow)}
body.dark .btn{color:#fff}
.btn.ghost{color:var(--ink);background:transparent}
.ficon{border-radius:6px;box-shadow:0 0 12px rgba(0,0,0,.15)}
.chip.on{box-shadow:0 0 12px var(--glow)}
.pill{border-radius:4px}
mark{background:rgba(var(--acc-rgb),.25);color:inherit;box-shadow:0 0 0 1px rgba(var(--acc-rgb),.5)}
body.dark mark{color:#fff}
header{border-bottom:1px solid var(--line2);position:relative}
header::after{content:"";position:absolute;left:0;bottom:-1px;width:180px;height:1px;background:linear-gradient(90deg,var(--acc),transparent);box-shadow:0 0 8px var(--acc)}
.back,.theme,.tag{background:var(--panel)}
.toast{font-family:var(--mono);font-size:12.5px}
.viewer .vbar{background:#061229;border-bottom:1px solid rgba(0,212,255,.35)}

/* light mode: colourful tech (aurora + iridescent glass) */
body:not(.dark){--bg:#e4e9f3;--bg-b:#dde3f0;--acc:#0891b2;--acc2:#0e7490;--acc-rgb:8,145,178;--violet:#7c3aed;--pink:#db2777;--glow:rgba(124,58,237,.22);--iri:linear-gradient(120deg,#06b6d4,#8b5cf6 50%,#ec4899)}
body:not(.dark) .card,body:not(.dark) .cat,body:not(.dark) .searchbar{border:1px solid transparent;background:linear-gradient(rgba(255,255,255,.86),rgba(255,255,255,.86)) padding-box,linear-gradient(120deg,rgba(6,182,212,.55),rgba(139,92,246,.55),rgba(236,72,153,.55)) border-box;box-shadow:0 8px 28px rgba(80,60,180,.10)}
body:not(.dark) .card:hover,body:not(.dark) .cat:hover{box-shadow:0 0 0 1px rgba(139,92,246,.35),0 14px 36px rgba(139,92,246,.20),0 0 24px rgba(6,182,212,.18)}
body:not(.dark) .searchbar:focus-within{box-shadow:0 0 0 2px rgba(139,92,246,.35),0 0 28px rgba(6,182,212,.25)}
body:not(.dark) .cat.add{background:rgba(255,255,255,.5);border:1px dashed rgba(124,58,237,.45)}
body:not(.dark) .card::before,body:not(.dark) .cat::before{background:
  linear-gradient(#06b6d4,#06b6d4) top left/14px 2px no-repeat,linear-gradient(#06b6d4,#06b6d4) top left/2px 14px no-repeat,
  linear-gradient(#ec4899,#ec4899) bottom right/14px 2px no-repeat,linear-gradient(#ec4899,#ec4899) bottom right/2px 14px no-repeat;opacity:1}
body:not(.dark) .cat .cicon{background:var(--iri);color:#fff;border:0;box-shadow:0 6px 18px rgba(139,92,246,.35)}
body:not(.dark) .cat::after{background:radial-gradient(circle at 70% 30%,rgba(236,72,153,.25),rgba(139,92,246,.12) 40%,transparent 70%);-webkit-mask-image:none;mask-image:none;border-radius:50%;opacity:1}
body:not(.dark) .hero h2 span,body:not(.dark) .cat .cfoot b{background:var(--iri);-webkit-background-clip:text;background-clip:text;color:transparent}
body:not(.dark) .btn{background:var(--iri);background-size:150% 100%;box-shadow:0 6px 20px rgba(139,92,246,.35);transition:background-position .4s}
body:not(.dark) .btn:hover{background-position:100% 0;filter:none}
body:not(.dark) .btn.ghost{background:rgba(255,255,255,.75);box-shadow:none;color:var(--ink)}
body:not(.dark) .btn.danger{background:rgba(220,38,38,.08);color:#dc2626;box-shadow:none}
body:not(.dark) .status{background:rgba(255,255,255,.8);color:#6d28d9;border-color:rgba(139,92,246,.4)}
body:not(.dark) .chip{background:rgba(255,255,255,.75)}
body:not(.dark) .chip.on{background:var(--iri);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(139,92,246,.3)}
body:not(.dark) .chip.on b{color:rgba(255,255,255,.85)}
body:not(.dark) .pill{background:rgba(16,185,129,.10);color:#047857;border-color:rgba(16,185,129,.35)}
body:not(.dark) .pill.type{background:rgba(139,92,246,.10);color:#6d28d9;border-color:rgba(139,92,246,.35)}
body:not(.dark) .pill.cat-pill{background:rgba(6,182,212,.10);color:#0e7490;border-color:rgba(6,182,212,.35)}
body:not(.dark) mark{background:linear-gradient(90deg,rgba(250,204,21,.55),rgba(244,114,182,.35));box-shadow:none}
body:not(.dark) header{border-bottom-color:rgba(139,92,246,.25)}
body:not(.dark) header::after{width:260px;background:var(--iri);box-shadow:none;height:2px}
body:not(.dark) .tag{background:var(--iri);color:#fff;border:0}
body:not(.dark) .crumbs a,body:not(.dark) .brand .sub{color:#6d28d9}

/* light mode palette: Cheng blue + protocol teal */
body:not(.dark){--bg:#efe6d6;--bg-b:#e6dac5;--panel:rgba(255,253,248,.9);--panel2:#fffdf8;--line:#e2d4bc;--line2:#d3c09f;--field:#fffdf8;--sheet:#fbf6ec;--soft:#f3eadb;--soft2:#f7f0e3;--acc:#0a8fca;--acc2:#0a6f9e;--acc-rgb:10,143,202;--violet:#0f9d8a;--glow:rgba(10,143,202,.22);--iri:linear-gradient(120deg,#00aeef,#0a6f9e)}
body:not(.dark) .card,body:not(.dark) .cat,body:not(.dark) .searchbar{background:linear-gradient(#fffdf8,#fffdf8) padding-box,linear-gradient(120deg,rgba(0,174,239,.5),rgba(15,157,138,.55)) border-box;box-shadow:0 6px 20px rgba(80,50,15,.08)}
body:not(.dark) .card:hover,body:not(.dark) .cat:hover{box-shadow:0 0 0 1px rgba(10,143,202,.35),0 12px 30px rgba(10,143,202,.16)}
body:not(.dark) .card::before,body:not(.dark) .cat::before{background:linear-gradient(#00aeef,#00aeef) top left/14px 2px no-repeat,linear-gradient(#00aeef,#00aeef) top left/2px 14px no-repeat,linear-gradient(#0f9d8a,#0f9d8a) bottom right/14px 2px no-repeat,linear-gradient(#0f9d8a,#0f9d8a) bottom right/2px 14px no-repeat}
body:not(.dark) .cat::after{background:radial-gradient(circle at 70% 30%,rgba(0,174,239,.18),rgba(15,157,138,.10) 45%,transparent 70%)}
body:not(.dark) .hero h2 span,body:not(.dark) .cat .cfoot b{background:linear-gradient(90deg,#00aeef,#0a6f9e 60%,#0f9d8a);-webkit-background-clip:text;background-clip:text;color:transparent}
body:not(.dark) .btn{background:linear-gradient(120deg,#00aeef,#0a6f9e);box-shadow:0 6px 18px rgba(10,143,202,.3)}
body:not(.dark) .chip.on{background:linear-gradient(120deg,#00aeef,#0a6f9e)}
body:not(.dark) .status{color:#0a6f9e;border-color:rgba(10,143,202,.35)}
body:not(.dark) .pill.type{background:rgba(10,143,202,.08);color:#0a6f9e;border-color:rgba(10,143,202,.3)}
body:not(.dark) .pill.cat-pill{background:rgba(15,157,138,.1);color:#8a6418;border-color:rgba(15,157,138,.35)}
body:not(.dark) .crumbs a,body:not(.dark) .brand .sub{color:#0a6f9e}
body:not(.dark) header{border-bottom-color:rgba(160,120,75,.3)}
body:not(.dark) header::after{background:linear-gradient(90deg,#00aeef,#0f9d8a,transparent)}
body:not(.dark) mark{background:rgba(250,204,21,.5)}
body:not(.dark) .cat.add{background:rgba(255,253,248,.6);border:1px dashed rgba(160,120,75,.5)}

/* arrange mode */
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.btn.ghost.on{border-color:var(--acc);color:var(--acc2);box-shadow:0 0 0 1px var(--acc)}
.arrhint{margin:0 0 12px;font-size:13px;color:var(--muted);font-family:var(--mono)}
.cats.arranging .cat{cursor:grab}
.cats.arranging .cat .cadm .grip,.arrctl .grip{display:grid;place-items:center;width:30px;height:30px;color:var(--acc2);font-weight:800;letter-spacing:-2px;cursor:grab}
.card.arr{cursor:grab;grid-template-columns:44px 1fr auto}
.arrctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.arrctl button,.cats.arranging .cadm button{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:6px;width:30px;height:26px;font-size:14px;line-height:1}
.arrctl button:disabled,.cats.arranging .cadm button:disabled{opacity:.3;cursor:default}
.dragging{opacity:.45;outline:2px dashed var(--acc)}
.movebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;font-size:13px;color:var(--muted);font-weight:600}
.droptgt{border:1.5px dashed var(--acc);color:var(--acc2);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;transition:all .15s}
.droptgt.over{background:var(--acc);color:#fff;transform:scale(1.05)}

/* ================= SOP HUB (blueprint grid) ================= */
.sopbg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(70vmax 45vmax at 90% -10%,rgba(0,174,239,.16),transparent 60%),
  radial-gradient(60vmax 40vmax at -10% 110%,rgba(15,157,138,.12),transparent 60%),
  repeating-linear-gradient(0deg,rgba(10,111,158,.055) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgba(10,111,158,.055) 0 1px,transparent 1px 28px),
  linear-gradient(180deg,#eef3f8,#e5edf4)}
body.dark .sopbg{background:
  radial-gradient(70vmax 45vmax at 90% -10%,rgba(0,212,255,.14),transparent 60%),
  radial-gradient(60vmax 40vmax at -10% 110%,rgba(20,200,170,.10),transparent 60%),
  repeating-linear-gradient(0deg,rgba(94,231,255,.05) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgba(94,231,255,.05) 0 1px,transparent 1px 28px),
  linear-gradient(180deg,#040a18,#081429)}
body:not(.dark){--bg:#eef3f8;--bg-b:#e5edf4;--panel:rgba(255,255,255,.9);--panel2:#ffffff;--line:#d6e1ec;--line2:#c3d3e3;--field:#ffffff;--sheet:#f6f9fc;--soft:#eaf1f8;--soft2:#f2f7fb}
.sopno{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:1px;color:var(--acc2);margin:0 0 3px}
.date{text-align:right}
.date .dlab{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.pill.st-current{background:rgba(16,185,129,.12)!important;color:#047857!important;border-color:rgba(16,185,129,.4)!important}
.pill.st-draft{background:rgba(245,158,11,.12)!important;color:#a16207!important;border-color:rgba(245,158,11,.4)!important}
.pill.st-superseded{background:rgba(100,116,139,.12)!important;color:#64748b!important;border-color:rgba(100,116,139,.35)!important}
.pill.rv-soon{background:rgba(245,158,11,.12)!important;color:#a16207!important;border-color:rgba(245,158,11,.4)!important}
.pill.rv-over{background:rgba(220,38,38,.10)!important;color:#dc2626!important;border-color:rgba(220,38,38,.4)!important}
body.dark .pill.st-current{color:#6ee7b7!important}body.dark .pill.st-draft,body.dark .pill.rv-soon{color:#fcd34d!important}body.dark .pill.st-superseded{color:#a3b1c6!important}body.dark .pill.rv-over{color:#fca5a5!important}
.card.sop-superseded{opacity:.72}
.card.sop-superseded h3{text-decoration:line-through;text-decoration-color:rgba(100,116,139,.5)}
.banner{border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.08);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 16px}
.banner.warn{border-color:rgba(220,38,38,.35);background:rgba(220,38,38,.07)}
.vers{display:grid;gap:8px}
.ver{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px}
.ver.on{border-color:rgba(var(--acc-rgb),.6);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.25)}
.ver .vno{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--acc2)}
.ver .vnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.ver .vact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ver .vact .btn.small{padding:6px 9px}
.dhead .sopno{margin-bottom:4px}
input[readonly].inp{background:var(--soft);color:var(--muted)}
.vbar .vtag.sup{color:#fca5a5!important;border-color:rgba(252,165,165,.45);background:rgba(220,38,38,.12)}

</style>

/* ---------- automatic sign-out after inactivity (shared with the portal) ---------- */
const IDLE_KEY = 'cctl-last-active', IDLE_MIN_KEY = 'cctl-idle-min';
const idleMin = () => { try { const v = +localStorage.getItem(IDLE_MIN_KEY); return v >= 15 ? v : 30; } catch { return 30; } };   // always on: 15 minutes minimum
const lastActive = () => { try { return +localStorage.getItem(IDLE_KEY) || 0; } catch { return 0; } };
let lastPing = 0, idleWarnEl = null, idleTimer = null;

  ['pointerdown', 'keydown', 'wheel', 'touchstart', 'mousemove', 'scroll'].forEach(ev => addEventListener(ev, () => markActive(), { passive: true, capture: true }));
  idleTimer = setInterval(async () => {
    const m = idleMin(); if (!m) return;
    const left = m * 60000 - (Date.now() - lastActive());
    if (left <= 0) { clearInterval(idleTimer); if (idleWarnEl) idleWarnEl.remove(); await sb.auth.signOut({ scope: 'local' }); document.querySelectorAll('.viewer,.overlay,.modal').forEach(n => n.remove()); gate('Signed out', 'You were signed out because of inactivity. Please sign in again.', true); return; }

      if (!idleWarnEl) { idleWarnEl = el('div', { class: 'idlewarn', role: 'alert' }, el('span', { class: 'iw-t' }), el('button', { class: 'btn', onclick: () => markActive(true) }, 'Stay signed in')); document.body.append(idleWarnEl); }

  if (error) { toast('Search error: ' + error.message); return; }

/* ---------- reading SOP details from the file ---------- */
const MON = 'jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?';

  else if ((m = s.match(/\b(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(' + MON + ')\\.?,?\\s+(20\\d{2})', 'i')))) { d = +m[1]; mo = MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase().slice(0, 3))) + 1; y = +m[3]; }
  else if ((m = s.match(new RegExp('\\b(' + MON + ')\\.?\\s+(\\d{1,2}),?\\s+(20\\d{2})', 'i')))) { d = +m[2]; mo = MONTHS.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0, 3))) + 1; y = +m[3]; }

  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  let title = name.replace(NO_RE, '').replace(/(?:^|[\s_\-(])(?:v|ver|version|rev)[\s_.]?\d{1,2}(?:\.\d{1,2})?\)?/i, '').replace(/[_]+/g, ' ').replace(/\s*[-–]\s*$|^\s*[-–]\s*/g, '').replace(/\s+/g, ' ').trim();

/* ---------- text extraction (any format) ---------- */
async function extractText(file, onStatus) {

    const pdf = await pdfjsLib.getDocument({ data: await buf() }).promise; let out = [];

      let line = '', lastY = null; const lines = [];
      for (const it of c.items) { const y = it.transform[5]; if (lastY !== null && Math.abs(y - lastY) > 2) { lines.push(line); line = ''; } line += it.str; lastY = y; }

    const wb = XLSX.read(await buf(), { type: 'array' });
    return { text: wb.SheetNames.map(n => `[${n}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false })).join('\n\n') };
  }

    await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');

  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'tif', 'tiff'].includes(e)) return { text: '', image: true };
  // anything else: keep as text only if it looks like text
  const head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
  if (!head.includes(0)) return { text: await file.text() };
  return { text: '', unsupported: true };
}

async function ocr(item, onStatus) {

  const e = ext(d.file_name);
  try {
    if (e === 'pdf') return await viewPdf(blob, body, zoomBox);
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'].includes(e)) {
      const bmp = await createImageBitmap(blob), cv = el('canvas'); cv.width = bmp.width; cv.height = bmp.height; cv.getContext('2d').drawImage(bmp, 0, 0);
      cv.style.width = Math.min(bmp.width, body.clientWidth - 40) + 'px'; body.replaceChildren(el('div', { class: 'vpages' }, cv)); return;
    }
    if (e === 'docx') {
      await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/docx-preview@0.4.1/dist/docx-preview.min.js');
      const box = el('div', { class: 'vdocx' }); body.replaceChildren(box);
      await docx.renderAsync(blob, box, null, { inWrapper: true, ignoreLastRenderedPageBreak: false, renderComments: false, renderChanges: false, useBase64URL: true });
      return;
    }
    if (['xlsx', 'xls', 'xlsm', 'ods', 'csv'].includes(e)) {
      await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
      const wb = XLSX.read(await blob.arrayBuffer(), { type: 'array', cellStyles: true });
      const sheet = el('div', { class: 'vsheet' }), tabs = el('div', { class: 'vtabs' });
      const show = n => { const tmp = el('div'); tmp.innerHTML = XLSX.utils.sheet_to_html(wb.Sheets[n], { header: '', footer: '' }); tmp.querySelectorAll('script,style,a').forEach(x => x.replaceWith(...x.childNodes)); sheet.replaceChildren(...tmp.childNodes); [...tabs.children].forEach(b => b.classList.toggle('on', b.textContent === n)); };
      wb.SheetNames.forEach(n => tabs.append(el('button', { class: 'chip', onclick: () => show(n) }, n)));
      body.replaceChildren(...(wb.SheetNames.length > 1 ? [tabs, sheet] : [sheet])); show(wb.SheetNames[0]); return;
    }
    if (e === 'pptx') {
      await loadScript('https://cdn.jsdelivr.net/npm/pptx-preview@1.0.7/dist/pptx-preview.umd.js');
      const w = Math.min(1000, body.clientWidth - 40), box = el('div', { style: 'display:flex;justify-content:center' });
      body.replaceChildren(box);
      await pptxPreview.init(box, { width: w, height: Math.round(w * 9 / 16), mode: 'list' }).preview(await blob.arrayBuffer());
      return;
    }
    if (['html', 'htm'].includes(e)) {
      const html = await blob.text(), fr = el('iframe', { class: 'vframe', sandbox: 'allow-same-origin', title: d.title });
      fr.srcdoc = html; body.replaceChildren(fr);
      fr.onload = () => { try { const dd = fr.contentDocument; const st = dd.createElement('style'); st.textContent = '*{-webkit-user-select:none!important;user-select:none!important}@media print{body{display:none}}'; dd.head.append(st);
        ['contextmenu', 'copy', 'cut', 'dragstart'].forEach(t => dd.addEventListener(t, ev => ev.preventDefault())); dd.addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && /^[acsxpu]$/i.test(ev.key)) ev.preventDefault(); if (ev.key === 'Escape') closeViewer(); });
        dd.querySelectorAll('a').forEach(a => a.removeAttribute('href')); fr.style.height = Math.max(dd.documentElement.scrollHeight + 20, 500) + 'px'; } catch {} };
      return;
    }
    // everything else: show the extracted text as a page
    const { data } = await sb.from('sop_documents').select('body_text').eq('id', d.id).maybeSingle();
    const text = data && data.body_text;
    if (text) { body.replaceChildren(el('div', { class: 'vmsg', style: 'margin:0 auto 16px;padding:10px 16px;max-width:1000px;font-size:12.5px', text: 'The original layout of this file type cannot be shown in the browser, so its text is shown instead. Upload a PDF version to see the original design.' }), el('div', { class: 'vdoc textview', text })); return; }
    msg('Preview not available', 'This file type cannot be displayed in the browser. Ask an administrator to upload a PDF version.');
  } catch (er) { console.error(er); msg('Could not display the document', er.message || String(er)); }
}

async function viewPdf(blob, body, zoomBox) {
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
  const first = await pdf.getPage(1), base = first.getViewport({ scale: 1 });
  let scale = Math.min(1.6, (Math.min(body.clientWidth, 1100) - 40) / base.width);
  const wrap = el('div', { class: 'vpages' }), pct = el('span', { style: 'min-width:44px;text-align:center' });
  body.replaceChildren(wrap);
  let io;
  const build = () => {
    if (io) io.disconnect();
    pct.textContent = Math.round(scale * 100) + '%';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    wrap.replaceChildren();
    io = new IntersectionObserver(ents => ents.forEach(async en => {
      if (!en.isIntersecting || en.target.dataset.done) return; en.target.dataset.done = '1';
      const page = await pdf.getPage(+en.target.dataset.p), vp = page.getViewport({ scale: scale * dpr });
      const cv = el('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = vp.width / dpr + 'px'; cv.style.height = vp.height / dpr + 'px';
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      en.target.replaceWith(cv);
    }), { root: body, rootMargin: '600px' });
    for (let i = 1; i <= pdf.numPages; i++) {
      const ph = el('div', { class: 'vpage-ph', 'data-p': String(i), style: `width:${base.width * scale}px;height:${base.height * scale}px` });
      wrap.append(ph); io.observe(ph);
    }
  };
  pdfState = { zoom: f => { scale = Math.max(0.4, Math.min(4, scale * f)); build(); } };
  zoomBox.replaceChildren(el('button', { class: 'x', 'aria-label': 'Zoom out', onclick: () => pdfState.zoom(1 / 1.15) }, icon('minus')), pct, el('button', { class: 'x', 'aria-label': 'Zoom in', onclick: () => pdfState.zoom(1.15) }, icon('plus')), el('span', { style: 'margin-left:6px', text: `${pdf.numPages} page${pdf.numPages === 1 ? '' : 's'}` }));
  build();
}
